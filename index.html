<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#49494B" />
    <script>
      // React보다 먼저 모드를 정해야 첫 화면 배경이 깜빡이지 않음
      // ?theme=dark | ?theme=light 로 강제 지정
      // 배경색은 colorPalette.ts의 bg.page와 맞출 것
      (function () {
        var KEY = "exhibition-theme";
        var BG = { dark: "#49494B", light: "#F7F7F7" };
        var isMode = function (m) {
          return m === "dark" || m === "light";
        };

        var mode = new URLSearchParams(location.search).get("theme");
        if (!isMode(mode)) {
          try {
            mode = sessionStorage.getItem(KEY);
          } catch (e) {}
        }
        if (!isMode(mode)) mode = Math.random() < 0.5 ? "dark" : "light";
        // 인앱 브라우저·개인정보 보호 모드에서는 storage 접근이 막힐 수 있음
        try {
          sessionStorage.setItem(KEY, mode);
        } catch (e) {}

        var root = document.documentElement;
        root.dataset.theme = mode;
        root.style.colorScheme = mode;
        root.style.background = BG[mode];
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", BG[mode]);
      })();
    </script>
    <title>NotAVoid</title>
    <meta
      name="description"
      content="2026 GRADUATION EXHIBITION · DSID × DSLIKELION"
    />
    ㅓ
    <meta property="og:type" content="website" />
    <meta property="og:title" content="사이는 공간: (비어있는 곳)이 아니다" />
    <meta property="og:description" content="The In-Between Is Not A Void" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
